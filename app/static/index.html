<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi vs Polymarket Arbitrage Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .opportunities-grid {
            display: grid;
            gap: 20px;
        }

        .opportunity-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .opportunity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .rank {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7c3aed;
            margin-right: 15px;
        }

        .arb-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .arb-positive {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .arb-negative {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .card-body {
            padding: 20px;
        }

        .market-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .platforms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .platform-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
        }

        .platform-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .platform-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .kalshi-color {
            color: #f97316;
        }

        .poly-color {
            color: #8b5cf6;
        }

        .prices-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .price-box {
            text-align: center;
            flex: 1;
            padding: 10px;
            border-radius: 8px;
        }

        .price-yes {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .price-no {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin-left: 10px;
        }

        .price-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .price-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .price-yes .price-value {
            color: #22c55e;
        }

        .price-no .price-value {
            color: #ef4444;
        }

        .similarity-bar {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .similarity-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .similarity-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .similarity-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .action-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .action-label {
            font-size: 0.8rem;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .action-text {
            font-weight: 500;
            color: #fff;
        }

        .market-links {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .market-link {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.3s ease;
        }

        .market-link.kalshi {
            background: rgba(249, 115, 22, 0.2);
            color: #f97316;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        .market-link.poly {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .market-link:hover {
            filter: brightness(1.2);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .no-results h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .last-updated {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 30px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #ef4444;
            margin: 20px 0;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .platforms-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                gap: 15px;
            }

            .stat {
                padding: 10px 15px;
            }

            .stat-value {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Arbitrage Detector</h1>
            <p class="subtitle">Real-time arbitrage opportunities between Kalshi and Polymarket</p>
        </header>

        <div class="stats-bar" id="stats-bar">
            <div class="stat">
                <div class="stat-value" id="kalshi-count">-</div>
                <div class="stat-label">Kalshi Markets</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="poly-count">-</div>
                <div class="stat-label">Polymarket Markets</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="matched-count">-</div>
                <div class="stat-label">Matched Markets</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="refresh-btn" onclick="fetchOpportunities()">
                Scan for Arbitrage
            </button>
        </div>

        <div class="error-message" id="error-message"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Scanning Kalshi and Polymarket for arbitrage opportunities...</p>
            <p style="color: #64748b; margin-top: 10px;">This may take a moment</p>
        </div>

        <div class="opportunities-grid" id="opportunities-grid"></div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function fetchOpportunities() {
            const btn = document.getElementById('refresh-btn');
            const loading = document.getElementById('loading');
            const grid = document.getElementById('opportunities-grid');
            const errorEl = document.getElementById('error-message');

            btn.disabled = true;
            btn.textContent = 'Scanning...';
            loading.classList.add('active');
            grid.innerHTML = '';
            errorEl.classList.remove('active');

            try {
                const response = await fetch(`${API_BASE}/api/v1/arbitrage/opportunities?top_n=10&min_similarity=0.5`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                console.error('Error fetching opportunities:', error);
                errorEl.textContent = `Error: ${error.message}. Please try again.`;
                errorEl.classList.add('active');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Scan for Arbitrage';
                loading.classList.remove('active');
            }
        }

        function displayResults(data) {
            // Update stats
            document.getElementById('kalshi-count').textContent = data.total_kalshi_markets;
            document.getElementById('poly-count').textContent = data.total_polymarket_markets;
            document.getElementById('matched-count').textContent = data.matched_markets;

            // Update last updated
            const lastUpdated = new Date(data.last_updated);
            document.getElementById('last-updated').textContent = `Last updated: ${lastUpdated.toLocaleString()}`;

            const grid = document.getElementById('opportunities-grid');

            if (data.opportunities.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h3>No Matching Markets Found</h3>
                        <p>Try lowering the similarity threshold or check back later.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = data.opportunities.map((opp, index) => createOpportunityCard(opp, index + 1)).join('');
        }

        function createOpportunityCard(opp, rank) {
            const isPositive = opp.arbitrage_percentage > 0;
            const arbBadgeClass = isPositive ? 'arb-positive' : 'arb-negative';
            const arbText = isPositive ? `+${opp.arbitrage_percentage.toFixed(2)}%` : `${opp.arbitrage_percentage.toFixed(2)}%`;

            return `
                <div class="opportunity-card">
                    <div class="card-header">
                        <div style="display: flex; align-items: center;">
                            <span class="rank">#${rank}</span>
                            <span class="arb-badge ${arbBadgeClass}">${arbText} Arbitrage</span>
                        </div>
                        <span style="color: #64748b; font-size: 0.85rem;">
                            ${(opp.similarity_score * 100).toFixed(0)}% match
                        </span>
                    </div>
                    <div class="card-body">
                        <div class="market-title">${escapeHtml(opp.kalshi_market.title)}</div>

                        <div class="platforms-grid">
                            <div class="platform-box">
                                <div class="platform-header">
                                    <span class="platform-name kalshi-color">Kalshi</span>
                                </div>
                                <div class="prices-row">
                                    <div class="price-box price-yes">
                                        <div class="price-label">YES</div>
                                        <div class="price-value">${(opp.kalshi_yes * 100).toFixed(1)}¢</div>
                                    </div>
                                    <div class="price-box price-no">
                                        <div class="price-label">NO</div>
                                        <div class="price-value">${(opp.kalshi_no * 100).toFixed(1)}¢</div>
                                    </div>
                                </div>
                            </div>

                            <div class="platform-box">
                                <div class="platform-header">
                                    <span class="platform-name poly-color">Polymarket</span>
                                </div>
                                <div class="prices-row">
                                    <div class="price-box price-yes">
                                        <div class="price-label">YES</div>
                                        <div class="price-value">${(opp.polymarket_yes * 100).toFixed(1)}¢</div>
                                    </div>
                                    <div class="price-box price-no">
                                        <div class="price-label">NO</div>
                                        <div class="price-value">${(opp.polymarket_no * 100).toFixed(1)}¢</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="similarity-bar">
                            <div class="similarity-label">Market Similarity</div>
                            <div class="similarity-track">
                                <div class="similarity-fill" style="width: ${opp.similarity_score * 100}%"></div>
                            </div>
                        </div>

                        ${isPositive ? `
                        <div class="action-box">
                            <div class="action-label">Recommended Action</div>
                            <div class="action-text">${escapeHtml(opp.recommended_action)}</div>
                        </div>
                        ` : ''}

                        <div class="market-links">
                            <a href="${opp.kalshi_market.url}" target="_blank" class="market-link kalshi">
                                View on Kalshi →
                            </a>
                            <a href="${opp.polymarket_market.url}" target="_blank" class="market-link poly">
                                View on Polymarket →
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-fetch on page load
        document.addEventListener('DOMContentLoaded', fetchOpportunities);
    </script>
</body>
</html>
